spring:
  application:
    name: service-estadisticas

server:
  port: 8020

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.cloud.client.hostname}:${spring.application.name}:${random.int}

management:
  endpoints:
    web:
      exposure:
        include: health,info,beans

info:
  app:
    name: Service Estadisticas - Lab 7 (1TEL05)
